# Managed by Ivaldi. This file is the same in every Project and is kept
# current for you, so don't edit it. CI logic lives in the shared workflow.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    uses: worldtree-industries/workflows/.github/workflows/go.yml@__SHARED_WORKFLOW_SHA__ # __SHARED_WORKFLOW_VERSION__
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
